aid: youi
name: Youi
review:
  question: Does Youi expose a public, self-serve developer portal or documented API
    for quote, bind, issue, or FNOL?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Australia
  tier: carrier-pc
  gated: true
findings:
  summary: |
    Youi publishes no public API surface. Every first-party developer-portal
    candidate was probed on 2026-07-25 and none exists: developer.youi.com.au,
    developers.youi.com.au, docs.youi.com.au and api.youi.com.au do not resolve
    in DNS at all, and https://www.youi.com.au/developers, /api, /developer,
    /partners and /integrations each return HTTP 404. The published sitemap
    (https://www.youi.com.au/sitemap.xml, HTTP 200, 618 URLs) contains no
    developer, API, integration or broker-integration page — the only pages
    matching "partner" are sports sponsorships (NRL, Brisbane Lions).

    The one host that resolves and answers is portal.youi.com.au (HTTP 200),
    which is a CUSTOMER self-service policy portal, not a developer portal: it
    is an Angular single-page application titled "Youi Portal", carries
    <meta name="robots" content="noindex">, and links to a policy-manager login
    at https://secure.youi.com.au/Authentication/PolicyLogin.aspx. Its own HTML
    declares a private backend at https://portalapi.youi.com.au/ — that host
    resolves but returns HTTP 404 at root and serves no documentation:
    /swagger/index.html, /swagger/v1/swagger.json and /openapi.json all return
    HTTP 404. This is a first-party SPA backend, not a published API, and it is
    deliberately NOT listed as an API in apis.yml.

    No OpenAPI or Swagger document was found, so no openapi/ directory exists in
    this repo. No public Postman collection or workspace was found. No GraphQL
    endpoint was found. No .proto files. No webhook or event catalog and no
    AsyncAPI — an absence that is itself the finding for this sector.

    ACORD posture: no ACORD reference found. Searches across the Youi public
    site and sitemap for ACORD, AL3, ACORD XML, ACORD certified and NGDS
    returned nothing. This is consistent with Youi's direct-to-consumer model —
    it does not distribute through brokers or agency management systems, so it
    has no agency-download / IVANS-style seam and no reason to publish ACORD
    transports.

    Quote / bind / issue / FNOL: none of the four insurance verbs is exposed
    programmatically to any external party. Quoting is a consumer web/phone
    flow (https://www.youi.com.au/quote-start, HTTP 200); claims/FNOL is a
    consumer web and phone flow (https://www.youi.com.au/claiming). There is no
    agent-facing or partner-facing API and no embedded-insurance distribution
    surface.

    Auth model: no public/documented developer authentication exists. There is
    no OpenID Connect discovery document — https://www.youi.com.au/.well-known/openid-configuration
    and https://portalapi.youi.com.au/.well-known/openid-configuration both
    return HTTP 404, as does /.well-known/oauth-authorization-server. The only
    observable authentication is an end-customer session login into the ASP.NET
    policy-manager at secure.youi.com.au (HTTP 200) fronting the SPA portal.

    Market context: Australia has the legal machinery for open insurance and no
    live obligation. APRA supervises prudentially; the Consumer Data Right that
    opened banking and energy was designated to extend to general insurance and
    then deferred and de-prioritised. Youi is a general insurer, so no CDR
    obligation touches it, and nothing else forces a public interface.
