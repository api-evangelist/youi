  - protocol: HTTPS single-page app + private JSON backend
    scheme: https
    baseURL: https://portalapi.youi.com.au/
    documented: false
    note: First-party backend for the customer portal SPA. Root returns HTTP 404;
      no swagger/openapi document served. Not a published API.
  - protocol: REST
    documented: false
    note: No public REST API is documented by Youi.
  - protocol: GraphQL
    documented: false
    note: No /graphql surface found.
  - protocol: Webhooks / events
    documented: false
    note: No event catalog and no AsyncAPI. Absence is the finding.
  - protocol: ACORD / AL3 / EDI
    documented: false
    note: No ACORD, AL3, ACORD XML, NGDS or IVANS reference anywhere on the
      public site. Direct-to-consumer carrier with no agency-management seam.
